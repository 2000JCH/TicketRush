worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # 대기열 "진입" API 앞단의 1차 방어(decisions.md 4번) — Rate Limiting은 순서 무관하게 초과
    # 요청을 거절하는 것이고, "먼저 온 사람이 먼저 산다"는 공정성은 대기열(Redis Sorted Set)이
    # 이미 보장한다. 그래서 Rate Limiting 대상은 진입 API 하나뿐이고, 순번 폴링(GET .../me)이나
    # 다른 API는 여기서 제한하지 않는다.
    #
    # rate/burst 값은 아직 placeholder다 — 다른 TTL/타임아웃 값들과 마찬가지로 3주차 Gatling
    # 부하테스트에서 실측 후 조정한다(progress.md "여유 있을 때 결정 가능" 참고 패턴과 동일).
    limit_req_zone $binary_remote_addr zone=queue_entry:10m rate=5r/s;
    limit_req_status 429;

    # 백엔드가 아직 컨테이너화되지 않아(Dockerfile 착수 전, CLAUDE.md 참고) 호스트에서
    # gradlew bootRun으로 떠 있는 것을 그대로 가리킨다. Docker Desktop은 host.docker.internal을
    # 기본 제공한다.
    upstream backend {
        server host.docker.internal:8080;
    }

    server {
        listen 80;

        location ~ ^/api/v1/events/[0-9]+/queue/entries$ {
            limit_req zone=queue_entry burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
