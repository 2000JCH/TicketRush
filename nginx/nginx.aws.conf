worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 대기열 "진입" API 앞단의 1차 방어(decisions.md 4번). nginx.conf와 동일 — 차이는 upstream과
    # 정적 파일(프론트엔드) 서빙이 추가된 것뿐.
    limit_req_zone $binary_remote_addr zone=queue_entry:10m rate=5r/s;
    limit_req_status 429;

    # AWS에서는 앱도 컨테이너라 도커 네트워크 안의 서비스명으로 가리킨다.
    upstream backend {
        server app:8080;
    }

    server {
        listen 80;

        location ~ ^/api/v1/events/[0-9]+/queue/entries$ {
            limit_req zone=queue_entry burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /actuator/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # 프론트엔드(React Router) 정적 파일. 새로고침 시 존재하지 않는 경로도
        # index.html로 폴백해 클라이언트 라우터가 처리하게 한다.
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
