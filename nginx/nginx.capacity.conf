# 한계 테스트 전용 nginx 설정 — nginx.rehearsal.conf에서 대기열 진입 rate limit만 뺀 버전.
# 이유: 한계 테스트는 단일 호스트에서 수천 연결을 한꺼번에 던지므로 per-IP rate limit이 전부를
# 429로 막아 "앱 한계"가 아니라 "nginx 설정"을 재게 된다. rate limit 자체는 카오스 A-1에서 별도 검증됨.
# 또 이 설정은 AWS의 ALB/nginx가 커넥션 스톰을 흡수하는 상황(= Docker Desktop 포트 프록시 우회)을
# 재현하기 위한 것이기도 하다.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    upstream backend {
        server app:8080 max_fails=0;
        keepalive 256;
    }

    server {
        listen 80 backlog=4096;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
