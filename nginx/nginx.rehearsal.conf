worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # 대기열 "진입" API 앞단의 1차 방어(decisions.md 4번). nginx.conf와 동일 — 차이는 upstream뿐.
    limit_req_zone $binary_remote_addr zone=queue_entry:10m rate=5r/s;
    limit_req_status 429;

    # 리허설/AWS에서는 앱도 컨테이너라 도커 네트워크 안의 서비스명으로 가리킨다
    # (평소 개발용 nginx.conf는 host.docker.internal:8080 — 호스트에서 도는 bootRun을 가리킴).
    upstream backend {
        server app:8080;
    }

    server {
        listen 80;

        location ~ ^/api/v1/events/[0-9]+/queue/entries$ {
            limit_req zone=queue_entry burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
