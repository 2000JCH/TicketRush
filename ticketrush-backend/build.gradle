plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	// 부하 테스트(decisions.md 2·8번). 시뮬레이션은 src/gatling/java/simulation 에 둔다(classq와 동일).
	// 카오스 테스트에도 이 시나리오를 그대로 재사용한다(별도 트래픽 스크립트를 만들지 않음).
	id 'io.gatling.gradle' version '3.15.1.3'
}

group = 'com.ticketrush'
version = '0.0.1-SNAPSHOT'
description = 'TicketRush'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Kafka exactly-once(decisions.md 6번) — outbox_events를 Debezium이 발행한 토픽을 소비한다.
	// Spring Boot 4부터는 spring-kafka만 추가하면 KafkaAutoConfiguration이 전혀 안 붙는다(패키지가
	// org.springframework.boot.kafka.autoconfigure로 분리됨) — 반드시 이 스타터를 써야 한다.
	// 실제로 spring-kafka만 넣었다가 @KafkaListener가 전혀 등록되지 않는 걸 겪고 알아낸 것
	// (2026-08-27, spring-boot #48880/spring-kafka #4278).
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	// 카오스/부하테스트 관찰용(3주차). Actuator + Micrometer만 추가하면 API 응답시간/에러율뿐 아니라
	// HikariCP 커넥션 풀·Kafka Consumer lag까지 /actuator/prometheus에 자동으로 노출된다
	// (Spring Boot가 두 클라이언트를 Micrometer에 자동 바인딩) — 별도 exporter가 필요 없다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	// jjwt의 JSON 직렬화기. jjwt-jackson은 Jackson 2를 요구하는데 Spring Boot 4는 Jackson 3을 쓰므로 gson을 쓴다.
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'
	// 그룹 좌석 홀드 분산락(decisions.md 2번)용. redisson-spring-boot-starter 대신 core만 추가하고
	// RedissonClient를 직접 구성한다 — RLock은 값 직렬화가 필요 없어 Spring Boot 4의 Jackson 3와
	// Redisson의 Jackson 2 기반 Spring 자동 설정이 얽힐 여지를 애초에 만들지 않기 위함.
	implementation 'org.redisson:redisson:4.7.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
