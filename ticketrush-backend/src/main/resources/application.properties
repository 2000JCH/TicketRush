spring.application.name=TicketRush

# .env(로컬 비밀값)를 프로퍼티로 읽어들인다. optional이라 파일이 없어도 기동은 된다.
spring.config.import=optional:file:.env[.properties]

# 카오스/부하테스트 관찰용(3주차) — Prometheus가 스크랩할 엔드포인트만 연다.
# health는 컨테이너/로드밸런서 헬스체크에도 쓸 수 있어 함께 열어둔다.
management.endpoints.web.exposure.include=health,prometheus
# http.server.requests에 히스토그램 버킷을 붙여 Prometheus/Grafana에서 P95/P99 등 분위수를
# 계산할 수 있게 한다. 기본값은 count/sum/max만 내보내 꼬리 지연(P99)을 볼 수 없다 —
# 분산락 벤치마크 채택 기준(decisions.md 2번)이 그룹 홀드 P99를 처리량과 동등하게 보기 때문에 필수다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# SLO 경계 부근(200ms~10s)에 버킷을 집중시켜 그 구간 분위수 정확도를 높인다.
management.metrics.distribution.slo.http.server.requests=200ms,500ms,1s,2s,5s,10s

# rewriteBatchedStatements=true: 좌석 대량 생성(JdbcTemplate batchUpdate)이 실제로 여러 행을
# 한 INSERT 문으로 합쳐 전송되게 한다. 이 옵션이 없으면 batch를 써도 내부적으로는 한 건씩 나간다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketrush?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:ticketrush}
spring.datasource.password=${DB_PASSWORD:ticketrush}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 로컬 개발 편의를 위해 엔티티 기준으로 테이블을 자동 생성/변경한다.
# db-schema.md의 생성 컬럼·CHECK 제약은 이 방식으로 표현되지 않으므로,
# reservation_seat까지 구현하는 시점에 명시적 스키마 관리 방식을 다시 정해야 한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis 커맨드 타임아웃. 미설정 시 Lettuce 기본값(60초)이 적용되는데, 카오스 테스트 A-1(Redis 다운)에서
# 장애 시작 직후 들어온 요청이 Redis 복구 후에도 최대 60초 매달렸다 QueryTimeoutException으로 늦게
# 실패하는 걸 확인했다(test-results.md 1번, decisions.md 11번). 정상 P99가 ~90ms라 2초는 정상 동작에
# 여유가 충분하면서 장애 시 빠른 실패(사용자가 스피너 대신 즉시 에러 → 재시도)를 보장한다.
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# outbox_events → Debezium(Outbox Event Router SMT)이 발행하는 토픽. 메시지 키/값 모두 문자열로
# 받아 애플리케이션에서 직접 JSON을 파싱한다(스키마 레지스트리를 두지 않기 위한 단순화).
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# 컨슈머 그룹이 처음 뜰 때 이미 쌓여있던 이벤트도 놓치지 않도록 earliest로 둔다.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:ticketrush-reservation}

# outbox_events → Debezium Outbox Event Router가 aggregate_type("reservation") 기준으로
# 발행하는 토픽 이름(scripts/register-outbox-connector의 route.topic.replacement와 일치해야 함).
reservation.outbox.kafka-topic=${RESERVATION_OUTBOX_TOPIC:ticketrush.reservation.events}

# Kafka Connect REST API 주소 — outbox 커넥터 등록 스크립트가 사용한다(앱 코드에서는 쓰지 않음).
kafka.connect.rest-url=${KAFKA_CONNECT_REST_URL:http://localhost:8083}

# 포트원(V2) 웹훅 서명 검증 시크릿. 콘솔에서 아직 발급받지 못해 비어있는 상태 — 값이 없으면
# PaymentWebhookController가 서명 검증을 건너뛰지 않고 즉시 거절한다(빈 시크릿으로 검증을
# 통과시키는 건 인증을 끈 것과 같아서 더 위험하기 때문). 값이 채워지는 즉시 실서명 검증이 켜진다.
portone.webhook-secret=${PORTONE_WEBHOOK_SECRET:}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# 기본값 true(decisions.md 3번). https가 아닌 로컬에서만 .env로 false를 준다.
auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}

admin.email=${ADMIN_EMAIL:admin@ticketrush.com}
admin.password=${ADMIN_PASSWORD:admin1234}

# 좌석 홀드 TTL. decisions.md 1번이 5~10분 범위로만 정해둔 값이라 우선 10분으로 두고,
# 3주차 부하 테스트에서 확정한다. 입장 토큰 TTL도 이 값을 그대로 쓴다(decisions.md 4번).
seat.hold-ttl-millis=${SEAT_HOLD_TTL:600000}

# 홀드 만료 스케줄(hold_schedule) 처리 주기(redis-design.md 4-1번).
# 대기열 입장 처리 주기(queue.admit-interval-millis)와 같은 폴링 패턴이다.
seat.hold-expiry-check-interval-millis=${SEAT_HOLD_EXPIRY_CHECK_INTERVAL:3000}

# 결제 처리 타임아웃(PG 응답을 얼마나 기다릴지, decisions.md 5번 "미정 사항"). 아직 구체적인
# 수치가 정해지지 않아 홀드 TTL과 마찬가지로 우선 넉넉히 2분으로 두고, 3주차 결제 연동/부하
# 테스트에서 확정한다.
payment.processing-timeout-millis=${PAYMENT_PROCESSING_TIMEOUT:120000}

# 대기열에서 한 번에 입장시킬 인원과 그 주기.
# 이 둘과 홀드 TTL·좌석 수의 조합이 실제 처리량을 결정하므로 부하 테스트에서 함께 조정한다.
queue.admit-count=${QUEUE_ADMIT_COUNT:100}
queue.admit-interval-millis=${QUEUE_ADMIT_INTERVAL:1000}

# 그룹 좌석 홀드(2매 동시 선택) 락 전략: redis(Redisson RLock) 또는 db(SELECT ... FOR UPDATE).
# 분산락 벤치마크(decisions.md 2번) — 두 방식 다 구현해두고 이 값으로 전환한다.
# 어느 쪽을 최종 채택할지는 3주차 Gatling 실측 비교 후 결정한다(사용자 확인 완료, 오늘은 구현까지만).
group-hold.lock-strategy=${GROUP_HOLD_LOCK_STRATEGY:redis}
# Redisson tryLock의 대기 시간(락이 이미 걸려있을 때 얼마나 기다릴지)과 보유 시간(응답 없이
# 죽었을 때 자동 해제까지 걸리는 시간)이다.
group-hold.lock-wait-millis=${GROUP_HOLD_LOCK_WAIT:3000}
group-hold.lock-lease-millis=${GROUP_HOLD_LOCK_LEASE:5000}

# 데모용 프론트엔드(Vite 개발 서버) CORS 허용 오리진. httpOnly Refresh Token 쿠키를 주고받으므로
# allowCredentials=true가 필요하고, 그러면 "*"를 쓸 수 없어 오리진을 명시해야 한다.
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
