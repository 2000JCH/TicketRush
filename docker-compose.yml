services:
  mysql:
    image: mysql:8.0
    container_name: ticketrush-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketrush
      MYSQL_USER: ticketrush
      MYSQL_PASSWORD: ticketrush
    ports:
      - "3306:3306"
    # Debezium이 binlog를 읽을 수 있도록 CDC용 옵션을 켠다 (decisions.md 6번, db-schema.md outbox_events)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: ticketrush-redis
    ports:
      - "6379:6379"
    # AOF/RDB 영속성은 켜지 않는다(decisions.md 1번, redis-design.md "설정") —
    # 여기 저장되는 좌석 홀드 등은 휘발돼도 되는 임시 상태라 디스크 복구가 필요 없다.
    # --save ""를 명시하지 않으면 이미지 기본값(RDB 스냅샷 주기)이 그대로 켜져 있으므로 함께 끈다.
    command: redis-server --save ""
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ticketrush-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: 호스트(로컬 Spring Boot 앱)에서 접속, PLAINTEXT_INTERNAL: 도커 네트워크 안(Kafka Connect 등)에서 접속
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # true로 둔다(2026-08-27) — Debezium Outbox 커넥터(decisions.md 6번)가 aggregate_type 값에
      # 따라 토픽을 동적으로 만든다(route.topic.replacement). false였을 때 대상 토픽이 없어
      # 커넥터 태스크가 UNKNOWN_TOPIC_OR_PARTITION 재시도 루프에 빠져 전혀 발행을 못 하는 문제를
      # 실제로 겪었다 — 로컬 1인 개발 규모라 토픽 난립 위험보다 이 문제를 피하는 게 더 실용적이다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      CLUSTER_ID: GQIZo3kUxRLhbn8NBZPs5Q

  kafka-connect:
    # Debezium MySQL 커넥터가 이미 포함된 이미지 (decisions.md 6번 Outbox 패턴 CDC)
    image: debezium/connect:2.6
    container_name: ticketrush-kafka-connect
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium-configs
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status

  nginx:
    image: nginx:1.27
    container_name: ticketrush-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Windows Docker Desktop은 기본 제공하지만, 다른 환경에서도 동작하도록 명시한다.
      - "host.docker.internal:host-gateway"

  # 카오스/부하테스트 관찰용(3주차, classq 참고 — 구조만 참고하고 우리 스택에 맞게 새로 구성함).
  # Actuator+Micrometer 덕분에 백엔드 하나만 스크랩해도 API 응답시간/에러율·HikariCP 커넥션 풀·
  # Kafka Consumer lag까지 전부 잡힌다(별도 exporter 불필요) — Prometheus 설정도 그래서 단순하다.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ticketrush-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ticketrush-grafana
    ports:
      - "3000:3000"
    environment:
      # 기본값(admin)과 같지만 명시한다 — 로컬 전용이라 그대로 둔다.
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # 카오스 테스트 중 타임라인에 남기는 주석(annotation)·패널 편집이 docker compose down 후에도
      # 남도록 Grafana 상태를 볼륨에 둔다. 대시보드 자체는 이후 provisioning 파일로 관리한다.
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  mysql_data:
  redis_data:
  grafana_data: